# Watchdog for Refledger observatory health and Pages rebuilds.
# Deploy only from this directory. Never bind routes or custom domains.
name = "refledger-watchdog"
main = "src/index.ts"
compatibility_date = "2026-09-29"
workers_dev = false
preview_urls = false

[triggers]
# Health checks every 15 minutes; Pages rebuild at :07 every 3 hours.
crons = ["*/15 * * * *", "7 */3 * * *"]

# Optional but recommended: persistent rebuild counters across isolates.
# Create with: wrangler kv namespace create WATCHDOG_STATE
# Then paste the id below (and preview_id for local).
# [[kv_namespaces]]
# binding = "STATE"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"
