name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: npm audit
        run: node scripts/check-audit.mjs

      - name: Fetch ledger data
        run: npm run fetch-data

      - name: Typecheck
        run: |
          npm run typecheck
          npm --prefix watchdog ci
          npm --prefix watchdog run typecheck

      - name: Unit tests, conformance vectors, and property tests
        run: npm test

      - name: Publish verify assets and OG images
        run: |
          node scripts/publish-verify-data.mjs
          node scripts/generate-og.mjs

      - name: Build
        run: npx astro build

      - name: Copy rules
        run: npm run check:copy

      - name: Words glued to links
        run: node scripts/check-glued-links.mjs

      - name: Action pin SHAs match version comments
        run: npm run check:pins

      - name: JS size budget
        run: npm run check:size

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke
        run: npm run test:e2e

      - name: Visual screenshots
        run: SCREEN_DIR=design/screens/ci npx playwright test tests/e2e/visual.spec.ts

      - name: Lighthouse home
        run: |
          npx astro preview --host 127.0.0.1 --port 4321 &
          PREVIEW_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then break; fi
            sleep 1
          done
          for url in "/" "/check?example=1" "/e/1" "/incidents" "/verify"; do
            name=$(echo "$url" | tr '/?' '__')
            npx --yes lighthouse@12.8.2 "http://127.0.0.1:4321${url}" \
              --chrome-flags="--headless --no-sandbox" \
              --only-categories=performance,accessibility,best-practices,seo \
              --quiet \
              --output=json \
              --output-path="./lh${name}.json"
            node -e "
              const r=require('./lh${name}.json');
              const scores=Object.fromEntries(Object.entries(r.categories).map(([k,v])=>[k, Math.round(v.score*100)]));
              console.log('Lighthouse ${url}', scores);
              const bad=Object.entries(scores).filter(([,s])=>s<98);
              if (bad.length) { console.error('Below 98:', bad); process.exit(1); }
            "
          done
          kill $PREVIEW_PID || true
