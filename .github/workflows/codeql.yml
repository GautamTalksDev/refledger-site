# CodeQL. Ready for when the repository goes public (private repos need
# GitHub Advanced Security for code scanning alerts).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '28 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skip-private:
    name: Wait for public repository
    if: ${{ github.event.repository.private }}
    runs-on: ubuntu-24.04
    steps:
      - name: CodeQL needs a public repository or GHAS
        run: echo "CodeQL analysis is ready and will run when this repository is public (or GHAS is enabled)."

  analyze:
    name: Analyze
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          category: '/language:${{ matrix.language }}'
