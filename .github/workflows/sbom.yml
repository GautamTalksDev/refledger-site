# CycloneDX SBOM for the site's npm dependency graph.
name: SBOM

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cyclonedx:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cdxgen@12.8.5 -o sbom.json -t npm --spec-version 1.5

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cyclonedx-sbom
          path: sbom.json
          if-no-files-found: error
