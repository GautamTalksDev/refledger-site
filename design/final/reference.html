function runCheck(source) {

}
function page404() {
  return '<div class="wrap narrow" style="padding-top:96px"><div class="mono" style="font-size:clamp(110px,18vw,240px);line-height:.8;font-weight:700;letter-spacing:-.06em">404</div><h1 class="h2" tabindex="-1" style="margin-top:32px">No page here.</h1><p class="lede" style="margin-top:16px">Unlike a moved tag, this is something we can say for certain.</p><div class="row" style="margin-top:30px"><a href="#/" class="btn b-blue">Check a repository</a><a href="#/moved" class="btn b-line">See what moved</a></div></div>';
}

/* router */
function route() {
  var h = location.hash.replace(/^#\/?/, '');
  var qi = h.indexOf('?'); var q = {};
  if (qi !== -1) { h.slice(qi + 1).split('&').forEach(function (p) { var kv = p.split('='); q[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || ''); }); h = h.slice(0, qi); }
  var parts = h.split('/').filter(Boolean);
  if (!parts.length) return { name: 'home', q: q };
  if (parts[0] === 'check') return { name: 'check', q: q };
  if (parts[0] === 'paste') return { name: 'paste', q: q };
  if (parts[0] === 'moved') return { name: 'moved', q: q };
  if (parts[0] === 'how') return { name: 'how', q: q };
  if (parts[0] === 'verify') return { name: 'verify', q: q };
  if (parts[0] === 'incidents') return { name: 'incidents', q: q };
  if (parts[0] === 'e') return { name: 'entry', q: q };
  if (parts[0] === 'a' && parts.length === 3) return { name: 'action', key: parts[1] + '/' + parts[2], q: q };
  if (parts[0] === 'a' && parts.length === 4) return { name: 'tag', key: parts[1] + '/' + parts[2], tag: parts[3], q: q };
  return { name: '404', q: q };
}
var lastName = null;
function render() {
  var r = route();
  var navKey = { home: 'home', check: 'home', paste: 'home', moved: 'moved', how: 'how', verify: 'verify' }[r.name];
  document.querySelectorAll('[data-nav]').forEach(function (a) { if (a.getAttribute('data-nav') === navKey) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  var html;
  switch (r.name) {
    case 'home': html = pageHome(); break;
    case 'check': html = pageCheck(); break;
    case 'paste': html = pagePaste(); break;
    case 'moved': html = pageMoved(r.q); break;
    case 'how': html = pageHow(); break;
    case 'verify': html = pageVerify(); break;
    case 'incidents': html = pageIncidents(); break;
    case 'entry': html = pageEntry(); break;
    case 'action': html = pageAction(r.key); break;
    case 'tag': html = pageTag(r.key, r.tag); break;
    default: html = page404();
  }
  app.innerHTML = html;
  var titles = { home: 'Refledger: is your workflow running the code you think it is?', check: 'Your results, Refledger', paste: 'Paste a workflow, Refledger', moved: 'What moved, Refledger', how: 'How it works, Refledger', verify: 'Verify the ledger, Refledger', incidents: 'Incidents, Refledger', entry: 'Entry 57, Refledger', action: (r.key || '') + ', Refledger', tag: (r.key || '') + ' ' + (r.tag || '') + ', Refledger' };
  document.title = titles[r.name] || 'Not found, Refledger';
  if (r.name === 'how') { baseline = null; drawToy(); drawWall(); rehash(); }
  if (r.name !== lastName) { window.scrollTo(0, 0); var h1 = app.querySelector('h1'); if (h1) h1.focus({ preventScroll: true }); }
  lastName = r.name;
}
window.addEventListener('hashchange', function () { var next = route().name; if ((lastName === 'how' || lastName === 'verify') && next !== lastName) { clearTimers(); scrub.playing = null; } render(); });

/* events */
document.addEventListener('submit', function (e) {
  var f = e.target.getAttribute('data-form'); if (!f) return;
  e.preventDefault();
  if (f === 'check') { var v = e.target.querySelector('input').value; if (v.trim()) runCheck({ repo: v }); }
  if (f === 'paste') { runCheck({ files: [{ name: 'pasted.yml', text: e.target.querySelector('textarea').value }] }); }
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'scrub') { if (scrub.playing) { clearInterval(scrub.playing); scrub.playing = null; } scrub.t = Number(e.target.value); drawWall(); }
  if (e.target.closest && e.target.closest('[data-sec]') && e.target.isContentEditable) rehash();
});
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return;
  var a = b.getAttribute('data-act');
  if (a === 'paste') { location.hash = '#/paste'; }
  if (a === 'example') { runCheck({ example: true }); }
  if (a === 'rss') { e.preventDefault(); toast('The RSS feed goes live with the site.'); }
  if (a === 'copyfixed' && checkState && checkState.files) {
    var files = fixedFiles(checkState.files, checkState.results).filter(function (f) { return f.changed; });
    copyText(files.map(function (f) { return '# ' + f.name + '\n' + f.text; }).join('\n\n'), 'Copied. Paste over your workflow files.');
  }
  if (a === 'copycli') { copyText(document.getElementById('cli').textContent, 'Command copied'); }
  if (a === 'copypin') { copyText(b.getAttribute('data-text'), 'Pinned line copied'); }
  if (a === 'moment') {
    document.querySelectorAll('[data-act="moment"]').forEach(function (x) { x.classList.remove('b-ink'); x.classList.add('b-line'); x.setAttribute('aria-pressed', 'false'); });
    b.classList.add('b-ink'); b.classList.remove('b-line'); b.setAttribute('aria-pressed', 'true');
    var sha = b.getAttribute('data-sha'); var el = document.getElementById('mo-sha'); el.textContent = sha; el.style.color = sha === '13465d02' ? 'var(--blue)' : 'var(--ink)';
    document.getElementById('mo-note').textContent = b.getAttribute('data-note');
  }
  if (a === 'toymove') { toy.moved = true; toy.erased = false; drawToy(); }
  if (a === 'toyerase') { toy.erased = true; drawToy(); }
  if (a === 'toyreset') { toy.moved = false; toy.erased = false; drawToy(); }
  if (a === 'play') {
    if (scrub.playing) { clearInterval(scrub.playing); scrub.playing = null; drawWall(); return; }
    if (scrub.t >= 100) scrub.t = 0;
    scrub.playing = setInterval(function () { scrub.t = Math.min(100, scrub.t + 0.55); if (scrub.t >= 100) { clearInterval(scrub.playing); scrub.playing = null; } drawWall(); }, 50);
    timers.push(scrub.playing); drawWall();
  }
  if (a === 'tamper') {
    var t = document.querySelector('[data-sec="3"] h2[data-text]');
    if (t.dataset.orig) { t.textContent = t.dataset.orig; delete t.dataset.orig; }
    else { t.dataset.orig = t.textContent; t.textContent = 'Every move is signed and chained, mostly.'; }
    rehash();
  }
  if (a === 'editpage') {
    var on = b.getAttribute('aria-pressed') !== 'true';
    document.querySelectorAll('[data-sec] [data-text]').forEach(function (n) { n.setAttribute('contenteditable', on ? 'true' : 'false'); });
    b.setAttribute('aria-pressed', on ? 'true' : 'false'); b.textContent = on ? 'Stop editing' : 'Edit the page yourself';
    if (on) toast('Click any text above and change it.');
  }
  if (a === 'verify') {
    var cells = document.querySelectorAll('#vchain span'); var n = 0; var res = document.getElementById('vresult'); res.innerHTML = '';
    cells.forEach(function (c) { c.className = ''; });
    b.disabled = true;
    var iv = setInterval(function () {
      if (n < cells.length) { cells[n].className = (n === 39 || n === 42 || n === 63) ? 'seal' : 'on'; n++; document.getElementById('vstatus').textContent = 'Checking entry ' + n + ' of 64'; return; }
      clearInterval(iv); b.disabled = false; b.textContent = 'Verify again';
      document.getElementById('vstatus').textContent = 'Every hash matches. Every signature checks.';
      res.innerHTML = '<div class="rise mono" style="margin-top:26px;padding:20px 22px;border-radius:14px;background:var(--night2);font-size:14.5px;line-height:1.9">chain: OK<br>entries: 64 (seq 0 .. 63)<br>span: 2026-09-29 .. 2026-10-02<br>head: signed, valid, key b3e7...<br>coverage gaps recorded: 251 skipped, 1 failed polls</div>';
    }, 40);
    timers.push(iv);
  }
});

render();
})();
</script>
