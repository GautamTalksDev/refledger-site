name: matrix
on: pull_request
jobs:
  lint:
    strategy:
      matrix:
        node: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
---
name: second-doc
on: workflow_dispatch
jobs:
  other:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@v4
